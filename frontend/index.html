<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Job Agent — busca, analiza y organiza ofertas laborales: guarda, descarta y genera tu CV por oferta."
    />
    <title>Job Agent — Gestión de ofertas laborales</title>
    <script>
      // Aplica el tema antes del primer render (evita flash claro).
      // Por defecto: oscuro.
      (function () {
        try {
          var t = localStorage.getItem("ja-theme") || "oscuro";
          var dark =
            t === "oscuro" ||
            ((t === "sistema" || t === "oscuro-sistema") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
